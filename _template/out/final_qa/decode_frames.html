<!doctype html>
<meta charset="utf-8">
<title>decode vs render</title>
<!--
  Encode-fidelity QA. Decodes an MP4 with a <video> element at (n+0.5)/30 and compares
  each decoded frame against the renderer's own frame n (visuals.js drawFrame(ctx, n/30)).
  /out/final_qa/decode_frames.html?src=/out/nostalgia_bomberman_9x16_15s.mp4&tag=v1&png=1
    frames=15,30,...   (default: the QA list)
    png=1              save dec_fNNN.png / ref_fNNN.png / heat_fNNN.png into out/final_qa
    tag=<name>         report name: encode_report.json (tag=final) or encode_report_<tag>.json
    nb=1               also PSNR vs ref n-1 / n+1 (frame-alignment check)
  window.__done = report
-->
<body style="margin:0;background:#222;color:#ddd;font:12px monospace">
<pre id="o">running…</pre>
<script type="module">
const q = new URLSearchParams(location.search);
const src = q.get('src') || '/out/nostalgia_bomberman_9x16_15s.mp4';
const tag = q.get('tag') || 'final';
const savePng = q.get('png') === '1';
const nb = q.get('nb') !== '0';
const FR = (q.get('frames') || '15,30,33,45,60,75,76,90,112,150,186,218,232,240,252,282,315,360,365,380,420,449').split(',').map(Number);
const out = document.getElementById('o');
const log = s => { out.textContent += '\n' + s; };
const post = (name, body) => fetch(`/save?dir=final_qa&name=${encodeURIComponent(name)}`, { method: 'POST', body }).then(r => r.json());
const pad3 = n => String(n).padStart(3, '0');
window.__done = null;
const report = { src, tag, frames: [], errors: [] };

const once = (el, ev) => new Promise((res, rej) => {
  const ok = () => { el.removeEventListener('error', bad); res(); };
  const bad = () => { el.removeEventListener(ev, ok); rej(new Error('video error ' + (el.error && el.error.message))); };
  el.addEventListener(ev, ok, { once: true });
  el.addEventListener('error', bad, { once: true });
});

function stats(a, b, W, H, BS = 16) {
  // a = decoded, b = reference (RGBA Uint8ClampedArray)
  let se = 0, seY = 0, sd = [0, 0, 0];
  const bw = Math.ceil(W / BS), bh = Math.ceil(H / BS);
  const bmax = new Float32Array(bw * bh), bmse = new Float64Array(bw * bh);
  let over24 = 0, over48 = 0;
  for (let y = 0; y < H; y++) {
    const by = (y / BS) | 0;
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const dr = a[i] - b[i], dg = a[i + 1] - b[i + 1], db = a[i + 2] - b[i + 2];
      se += dr * dr + dg * dg + db * db;
      const dy = 0.2126 * dr + 0.7152 * dg + 0.0722 * db;
      seY += dy * dy;
      sd[0] += dr; sd[1] += dg; sd[2] += db;
      const m = Math.max(Math.abs(dr), Math.abs(dg), Math.abs(db));
      if (m > 24) over24++;
      if (m > 48) over48++;
      const k = by * bw + ((x / BS) | 0);
      if (m > bmax[k]) bmax[k] = m;
      bmse[k] += (dr * dr + dg * dg + db * db) / 3;
    }
  }
  const N = W * H;
  const psnr = mse => mse <= 1e-9 ? 99 : 10 * Math.log10(255 * 255 / mse);
  const blocks = [];
  for (let k = 0; k < bw * bh; k++) blocks.push({ k, max: bmax[k], psnr: psnr(bmse[k] / (BS * BS)) });
  blocks.sort((p, r) => p.psnr - r.psnr);
  const worst = blocks.slice(0, 6).map(o => ({ x: (o.k % bw) * BS, y: ((o.k / bw) | 0) * BS, max: o.max, psnr: +o.psnr.toFixed(2) }));
  const sortedMax = Array.from(bmax).sort((p, r) => p - r);
  return {
    psnr: +psnr(se / (3 * N)).toFixed(2), psnrY: +psnr(seY / N).toFixed(2),
    bias: sd.map(v => +(v / N).toFixed(2)),
    pctPxOver24: +(100 * over24 / N).toFixed(3), pctPxOver48: +(100 * over48 / N).toFixed(3),
    blockMaxP99: sortedMax[Math.floor(sortedMax.length * 0.99)], blockMaxMax: sortedMax[sortedMax.length - 1],
    worstBlockPsnr: worst[0].psnr, worstBlocks: worst, bmax, bw, bh,
  };
}
function quickPsnr(a, b) {
  let se = 0;
  for (let i = 0; i < a.length; i += 4) { const dr = a[i] - b[i], dg = a[i + 1] - b[i + 1], db = a[i + 2] - b[i + 2]; se += dr * dr + dg * dg + db * db; }
  const mse = se / (3 * a.length / 4);
  return mse <= 1e-9 ? 99 : +(10 * Math.log10(255 * 255 / mse)).toFixed(2);
}
// Codec-free ceiling: ref -> BT.709 limited YCbCr, 2x2 box-averaged chroma (4:2:0), bilinear
// chroma upsampling (MPEG-2 siting: left co-sited horizontally, centred vertically), back
// to RGB, 8-bit rounding throughout. Any player shows at best this.
function sim420(a, W, H) {
  const Kr = 0.2126, Kb = 0.0722, Kg = 1 - Kr - Kb;
  const cw = W / 2, ch = H / 2, Y = new Float32Array(W * H), Cb = new Float32Array(cw * ch), Cr = new Float32Array(cw * ch);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4, r = a[i] / 255, g = a[i + 1] / 255, b = a[i + 2] / 255;
    const yy = Kr * r + Kg * g + Kb * b;
    Y[y * W + x] = Math.round(16 + 219 * yy);
    const k = (y >> 1) * cw + (x >> 1);
    Cb[k] += (b - yy) / (2 * (1 - Kb)) / 4; Cr[k] += (r - yy) / (2 * (1 - Kr)) / 4;
  }
  for (let k = 0; k < cw * ch; k++) { Cb[k] = Math.round(128 + 224 * Cb[k]); Cr[k] = Math.round(128 + 224 * Cr[k]); }
  const out = new Uint8ClampedArray(W * H * 4);
  const samp = (P, fx, fy) => {
    fx = Math.max(0, Math.min(cw - 1, fx)); fy = Math.max(0, Math.min(ch - 1, fy));
    const x0 = Math.floor(fx), y0 = Math.floor(fy), x1 = Math.min(cw - 1, x0 + 1), y1 = Math.min(ch - 1, y0 + 1), ax = fx - x0, ay = fy - y0;
    return (P[y0 * cw + x0] * (1 - ax) + P[y0 * cw + x1] * ax) * (1 - ay) + (P[y1 * cw + x0] * (1 - ax) + P[y1 * cw + x1] * ax) * ay;
  };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const fx = x / 2, fy = (y - 0.5) / 2;
    const yy = (Y[y * W + x] - 16) / 219, cb = (samp(Cb, fx, fy) - 128) / 224, cr = (samp(Cr, fx, fy) - 128) / 224;
    const r = yy + 2 * (1 - Kr) * cr, b = yy + 2 * (1 - Kb) * cb, g = (yy - Kr * r - Kb * b) / Kg;
    const i = (y * W + x) * 4; out[i] = 255 * r; out[i + 1] = 255 * g; out[i + 2] = 255 * b; out[i + 3] = 255;
  }
  return out;
}
function heatPng(s) {
  const c = document.createElement('canvas'); c.width = s.bw * 4; c.height = s.bh * 4;
  const x = c.getContext('2d'); const img = x.createImageData(s.bw, s.bh);
  for (let k = 0; k < s.bw * s.bh; k++) {
    const v = Math.min(1, s.bmax[k] / 64);
    img.data[k * 4] = 255 * Math.min(1, v * 2); img.data[k * 4 + 1] = 255 * Math.max(0, 1 - Math.abs(v - 0.5) * 2) * (v > 0.1 ? 1 : 0.3);
    img.data[k * 4 + 2] = v < 0.1 ? 60 : 0; img.data[k * 4 + 3] = 255;
  }
  const t = document.createElement('canvas'); t.width = s.bw; t.height = s.bh; t.getContext('2d').putImageData(img, 0, 0);
  x.imageSmoothingEnabled = false; x.drawImage(t, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/png'));
}

(async () => {
  const t0 = performance.now();
  try {
    const { W, H, FPS } = await import('/timeline.js');
    const vis = await import('/visuals.js?cb=' + Date.now());
    await vis.initVisuals();
    const rc = document.createElement('canvas'); rc.width = W; rc.height = H;
    const rctx = rc.getContext('2d', { alpha: false, willReadFrequently: true });
    const renderRef = n => {
      // mirror export.js clearCanvas() exactly
      rctx.setTransform(1, 0, 0, 1, 0, 0); rctx.globalAlpha = 1; rctx.globalCompositeOperation = 'source-over';
      rctx.filter = 'none'; rctx.imageSmoothingEnabled = true; rctx.shadowBlur = 0; rctx.shadowColor = 'transparent';
      rctx.clearRect(0, 0, W, H); rctx.fillStyle = '#000'; rctx.fillRect(0, 0, W, H);
      rctx.save(); vis.drawFrame(rctx, n / FPS); rctx.restore();
      return rctx.getImageData(0, 0, W, H).data;
    };

    const blob = await fetch(src + (src.includes('?') ? '&' : '?') + 'cb=' + Date.now()).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); });
    report.bytes = blob.size;
    const v = document.createElement('video');
    v.muted = true; v.preload = 'auto'; v.playsInline = true;
    v.src = URL.createObjectURL(new Blob([blob], { type: 'video/mp4' }));
    await once(v, 'loadedmetadata');
    await once(v, 'canplay').catch(() => {});
    report.duration = v.duration; report.videoWidth = v.videoWidth; report.videoHeight = v.videoHeight;
    const dc = document.createElement('canvas'); dc.width = W; dc.height = H;
    const dctx = dc.getContext('2d', { willReadFrequently: true });

    const grab = async target => {
      v.currentTime = target;
      await once(v, 'seeked');
      if (v.requestVideoFrameCallback) await Promise.race([new Promise(r => v.requestVideoFrameCallback(() => r())), new Promise(r => setTimeout(r, 120))]);
      dctx.drawImage(v, 0, 0, W, H);
      return dctx.getImageData(0, 0, W, H).data;
    };
    for (const n of FR) {
      let dec = await grab((n + 0.5) / FPS);
      let ref = renderRef(n);
      // Chrome's <video> seek can present the NEXT frame when (n+0.5)/30 sits just before a
      // keyframe (seen at f076 -> f077 keyframe). Verify against n+1 and re-seek early in the
      // frame's window if the landing was wrong; the frame itself is in the file.
      let seekNote = null;
      if (n + 1 < 450) {
        const pn = quickPsnr(dec, ref), pnext = quickPsnr(dec, renderRef(n + 1));
        if (pnext > pn + 1) {
          const dec2 = await grab((n + 0.1) / FPS);
          ref = renderRef(n);
          if (quickPsnr(dec2, ref) > pn) { dec = dec2; seekNote = `(n+0.5)/30 showed f${n + 1} (${pnext} dB vs ${pn} dB); re-seeked to (n+0.1)/30`; }
        } else ref = renderRef(n);
      }
      const s = stats(dec, ref, W, H);
      const row = { n, t: +(n / FPS).toFixed(4), seekedTo: +v.currentTime.toFixed(4) };
      if (seekNote) row.seekNote = seekNote;
      if (q.get('ceil') !== '0') {
        const sim = sim420(ref, W, H);
        row.psnr420ceiling = quickPsnr(sim, ref);
        row.psnrVsCeiling = quickPsnr(dec, sim); // pure codec loss, 4:2:0 path removed
      }
      for (const [k, val] of Object.entries(s)) if (!['bmax', 'bw', 'bh'].includes(k)) row[k] = val;
      if (nb) {
        const nbv = {};
        for (const d of [-1, 1]) { const m = n + d; if (m >= 0 && m < 450) nbv[d > 0 ? 'next' : 'prev'] = quickPsnr(dec, renderRef(m)); }
        row.neighbourPsnr = nbv;
        row.aligned = Object.values(nbv).every(p => p <= s.psnr + 0.01);
        renderRef(n); // restore canvas to frame n for the PNG
      }
      if (savePng) {
        await post(`dec_f${pad3(n)}.png`, await new Promise(r => dc.toBlob(r, 'image/png')));
        await post(`ref_f${pad3(n)}.png`, await new Promise(r => rc.toBlob(r, 'image/png')));
        await post(`heat_f${pad3(n)}.png`, await heatPng(s));
      }
      report.frames.push(row);
      log(`f${pad3(n)} psnr ${row.psnr} (Y ${row.psnrY}) worstBlk ${row.worstBlockPsnr} max ${row.blockMaxMax} >48: ${row.pctPxOver48}% bias ${row.bias} aligned ${row.aligned} ceil420 ${row.psnr420ceiling} vsCeil ${row.psnrVsCeiling}${seekNote ? ' RESEEK' : ''}`);
    }
    const ps = report.frames.map(f => f.psnr);
    report.summary = {
      meanPsnr: +(ps.reduce((p, c) => p + c, 0) / ps.length).toFixed(2),
      minPsnr: Math.min(...ps),
      worst4: [...report.frames].sort((p, r) => p.psnr - r.psnr).slice(0, 4).map(f => f.n),
      worst4ByBlock: [...report.frames].sort((p, r) => p.worstBlockPsnr - r.worstBlockPsnr).slice(0, 4).map(f => f.n),
      allAligned: report.frames.every(f => f.aligned !== false),
      meanPsnrY: +(report.frames.reduce((p, f) => p + f.psnrY, 0) / ps.length).toFixed(2),
      mean420Ceiling: report.frames[0].psnr420ceiling ? +(report.frames.reduce((p, f) => p + f.psnr420ceiling, 0) / ps.length).toFixed(2) : null,
      meanVsCeiling: report.frames[0].psnrVsCeiling ? +(report.frames.reduce((p, f) => p + f.psnrVsCeiling, 0) / ps.length).toFixed(2) : null,
      minVsCeiling: report.frames[0].psnrVsCeiling ? Math.min(...report.frames.map(f => f.psnrVsCeiling)) : null,
    };
  } catch (e) { report.errors.push(String(e && e.stack || e)); }
  report.ms = Math.round(performance.now() - t0);
  try { await post(tag === 'final' ? 'encode_report.json' : `encode_report_${tag}.json`, JSON.stringify(report, null, 2)); } catch (e) { report.errors.push('save: ' + e); }
  window.__done = report;
  log(JSON.stringify(report.summary));
  if (report.errors.length) log(report.errors.join('\n'));
})();
</script>
</body>
